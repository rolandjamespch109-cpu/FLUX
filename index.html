<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#050505">
<title>FLUX</title>

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

html,
body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #050505;
    color: white;
    font-family: Arial, Helvetica, sans-serif;
}

button {
    font: inherit;
}

#app {
    position: relative;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background:
        radial-gradient(circle at 50% 45%, rgba(90, 70, 255, .09), transparent 35%),
        #050505;
}

/* =================================
   AMBIENT WORLD
================================= */

.ambient {
    position: absolute;
    inset: -25%;
    pointer-events: none;
    filter: blur(90px);
    opacity: .75;
    transition: transform 1s cubic-bezier(.2,.8,.2,1);
}

.orb {
    position: absolute;
    border-radius: 50%;
    mix-blend-mode: screen;
    animation: float 11s ease-in-out infinite alternate;
}

.orb.one {
    width: 42vw;
    height: 42vw;
    min-width: 280px;
    min-height: 280px;
    background: rgba(82, 56, 255, .18);
    top: 5%;
    left: 8%;
}

.orb.two {
    width: 35vw;
    height: 35vw;
    min-width: 240px;
    min-height: 240px;
    background: rgba(0, 190, 255, .13);
    right: 5%;
    bottom: 5%;
    animation-delay: -3s;
}

.orb.three {
    width: 28vw;
    height: 28vw;
    min-width: 200px;
    min-height: 200px;
    background: rgba(255, 50, 170, .1);
    left: 40%;
    top: 55%;
    animation-delay: -6s;
}

@keyframes float {
    from {
        transform: translate3d(-20px, -15px, 0) scale(1);
    }

    to {
        transform: translate3d(25px, 25px, 0) scale(1.12);
    }
}

/* =================================
   POINTER LIGHT
================================= */

.pointer-light {
    position: fixed;
    width: 340px;
    height: 340px;
    border-radius: 50%;
    pointer-events: none;
    transform: translate(-50%, -50%);
    background: radial-gradient(
        circle,
        rgba(255,255,255,.08),
        rgba(100,80,255,.04) 35%,
        transparent 70%
    );
    z-index: 20;
    opacity: 0;
    transition: opacity .4s ease;
}

/* =================================
   SCREENS
================================= */

.screen {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    transition:
        opacity .9s cubic-bezier(.2,.8,.2,1),
        transform 1s cubic-bezier(.2,.8,.2,1),
        filter 1s ease;
}

/* =================================
   LANDING
================================= */

#landing {
    z-index: 10;
}

#landing.exit {
    opacity: 0;
    transform: scale(1.12);
    filter: blur(18px);
    pointer-events: none;
}

.hero {
    position: relative;
    width: min(900px, 92vw);
    text-align: center;
    z-index: 5;
}

.mini-label {
    font-size: 11px;
    letter-spacing: .38em;
    text-transform: uppercase;
    opacity: .45;
    margin-bottom: 28px;
}

.logo {
    font-size: clamp(72px, 17vw, 190px);
    line-height: .78;
    letter-spacing: -.085em;
    font-weight: 800;
    background: linear-gradient(
        120deg,
        #ffffff 10%,
        #bdb7ff 45%,
        #ffffff 70%,
        #8de8ff
    );
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    animation: logoPulse 5s ease-in-out infinite;
    user-select: none;
}

@keyframes logoPulse {
    0%, 100% {
        transform: scale(1);
        filter: brightness(1);
    }

    50% {
        transform: scale(1.015);
        filter: brightness(1.12);
    }
}

.tagline {
    margin-top: 35px;
    font-size: clamp(16px, 2.2vw, 24px);
    letter-spacing: .02em;
    opacity: .65;
}

.enter {
    position: relative;
    margin-top: 48px;
    border: 1px solid rgba(255,255,255,.18);
    background: rgba(255,255,255,.055);
    color: white;
    padding: 18px 34px;
    min-width: 190px;
    border-radius: 999px;
    cursor: pointer;
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    box-shadow:
        inset 0 1px rgba(255,255,255,.12),
        0 20px 70px rgba(0,0,0,.3);
    transition:
        transform .35s cubic-bezier(.2,.8,.2,1),
        background .35s ease,
        border-color .35s ease,
        box-shadow .35s ease;
    overflow: hidden;
}

.enter span {
    position: relative;
    z-index: 2;
    font-size: 12px;
    font-weight: 700;
    letter-spacing: .2em;
}

.enter::before {
    content: "";
    position: absolute;
    inset: 0;
    background: linear-gradient(
        110deg,
        transparent,
        rgba(255,255,255,.15),
        transparent
    );
    transform: translateX(-120%);
    transition: transform .7s ease;
}

.enter:hover {
    transform: translateY(-5px) scale(1.03);
    background: rgba(255,255,255,.1);
    border-color: rgba(255,255,255,.32);
    box-shadow:
        0 20px 70px rgba(90,80,255,.15),
        inset 0 1px rgba(255,255,255,.18);
}

.enter:hover::before {
    transform: translateX(120%);
}

.enter:active {
    transform: scale(.94);
}

/* =================================
   PLAYGROUND
================================= */

#playground {
    opacity: 0;
    transform: scale(.94);
    pointer-events: none;
    z-index: 5;
    flex-direction: column;
    justify-content: flex-start;
    padding: 28px;
}

#playground.active {
    opacity: 1;
    transform: scale(1);
    pointer-events: auto;
}

.play-top {
    width: min(1100px, 100%);
    display: flex;
    align-items: center;
    justify-content: space-between;
    z-index: 5;
}

.flux-small {
    font-size: 15px;
    font-weight: 800;
    letter-spacing: .15em;
}

.back {
    border: 1px solid rgba(255,255,255,.13);
    background: rgba(255,255,255,.045);
    color: rgba(255,255,255,.7);
    padding: 10px 17px;
    border-radius: 999px;
    cursor: pointer;
    backdrop-filter: blur(15px);
    -webkit-backdrop-filter: blur(15px);
    transition: .3s ease;
}

.back:hover {
    color: white;
    background: rgba(255,255,255,.09);
}

.play-content {
    width: min(1100px, 100%);
    flex: 1;
    display: flex;
    flex-direction: column;
    justify-content: center;
    padding: 30px 0;
}

.play-title {
    margin-bottom: 20px;
}

.play-title small {
    display: block;
    font-size: 10px;
    letter-spacing: .35em;
    opacity: .35;
    margin-bottom: 10px;
}

.play-title h2 {
    font-size: clamp(30px, 6vw, 62px);
    letter-spacing: -.045em;
    font-weight: 700;
    transition: color .8s ease;
}

.play-title p {
    margin-top: 10px;
    opacity: .45;
    font-size: 14px;
}

/* =================================
   LIQUID CARD
================================= */

.liquid-card {
    position: relative;
    height: min(55vh, 520px);
    min-height: 320px;
    border: 1px solid rgba(255,255,255,.1);
    border-radius: 32px;
    overflow: hidden;
    background:
        radial-gradient(
            circle at 50% 50%,
            rgba(100,90,255,.04),
            transparent 60%
        ),
        rgba(255,255,255,.025);
    box-shadow:
        inset 0 1px rgba(255,255,255,.06),
        0 30px 100px rgba(0,0,0,.35);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    transition:
        border-color .6s ease,
        box-shadow .6s ease;
}

.liquid-card.active {
    border-color: rgba(150,140,255,.2);
    box-shadow:
        inset 0 1px rgba(255,255,255,.08),
        0 30px 100px rgba(70,50,255,.12);
}

#liquidCanvas {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    touch-action: none;
}

.liquid-info {
    position: absolute;
    left: 24px;
    bottom: 22px;
    pointer-events: none;
    z-index: 2;
}

.liquid-info strong {
    display: block;
    font-size: 12px;
    letter-spacing: .18em;
}

.liquid-info span {
    display: block;
    margin-top: 6px;
    font-size: 11px;
    opacity: .35;
}

/* =================================
   INTERACTION INDICATOR
================================= */

.energy {
    position: absolute;
    right: 24px;
    bottom: 22px;
    display: flex;
    align-items: center;
    gap: 8px;
    pointer-events: none;
}

.energy-dot {
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: white;
    opacity: .3;
    transition:
        transform .2s ease,
        opacity .2s ease;
}

.energy-dot.active {
    opacity: .9;
    transform: scale(1.7);
}

.energy-text {
    font-size: 9px;
    letter-spacing: .18em;
    opacity: .3;
}

/* =================================
   FUTURE TOYS
================================= */

.toys {
    display: flex;
    gap: 10px;
    margin-top: 12px;
    overflow-x: auto;
    scrollbar-width: none;
}

.toys::-webkit-scrollbar {
    display: none;
}

.toy {
    flex: 1;
    min-width: 130px;
    border: 1px solid rgba(255,255,255,.07);
    background: rgba(255,255,255,.025);
    border-radius: 18px;
    padding: 15px;
    opacity: .38;
    transition:
        transform .3s ease,
        opacity .3s ease,
        background .3s ease;
}

.toy:hover {
    opacity: .7;
    transform: translateY(-3px);
    background: rgba(255,255,255,.045);
}

.toy-name {
    font-size: 11px;
    letter-spacing: .1em;
}

.toy-status {
    margin-top: 7px;
    font-size: 9px;
    letter-spacing: .15em;
    text-transform: uppercase;
}

/* =================================
   MOBILE
================================= */

@media (max-width: 600px) {

    #playground {
        padding: 20px;
    }

    .mini-label {
        margin-bottom: 22px;
    }

    .tagline {
        margin-top: 25px;
    }

    .enter {
        margin-top: 35px;
    }

    .play-content {
        padding: 20px 0;
    }

    .liquid-card {
        height: 48vh;
        min-height: 300px;
        border-radius: 25px;
    }

    .toy {
        flex: 0 0 135px;
    }
}
</style>
</head>

<body>

<div id="app">

    <div class="ambient" id="ambient">
        <div class="orb one"></div>
        <div class="orb two"></div>
        <div class="orb three"></div>
    </div>

    <div class="pointer-light" id="pointerLight"></div>

    <!-- =============================
         LANDING
    ============================== -->

    <section class="screen" id="landing">

        <div class="hero">

            <div class="mini-label">
                A digital playground
            </div>

            <div class="logo">
                FLUX
            </div>

            <div class="tagline">
                Do you wanna play with Flux?
            </div>

            <button class="enter" id="enterButton">
                <span>LET'S PLAY</span>
            </button>

        </div>

    </section>


    <!-- =============================
         PLAYGROUND
    ============================== -->

    <section class="screen" id="playground">

        <div class="play-top">

            <div class="flux-small">
                FLUX
            </div>

            <button class="back" id="backButton">
                ← EXIT
            </button>

        </div>


        <div class="play-content">

            <div class="play-title">

                <small>
                    PLAYGROUND / 001
                </small>

                <h2 id="liquidTitle">
                    Liquid.
                </h2>

                <p>
                    Move your finger. Disturb the surface.
                </p>

            </div>


            <div class="liquid-card" id="liquidCard">

                <canvas id="liquidCanvas"></canvas>

                <div class="liquid-info">

                    <strong>
                        LIQUID BLOB
                    </strong>

                    <span>
                        MOVE • TOUCH • EXPLORE
                    </span>

                </div>

                <div class="energy">

                    <div class="energy-dot" id="energyDot"></div>

                    <div class="energy-text">
                        ENERGY
                    </div>

                </div>

            </div>


            <div class="toys">

                <div class="toy">
                    <div class="toy-name">
                        GRAVITY
                    </div>
                    <div class="toy-status">
                        COMING SOON
                    </div>
                </div>

                <div class="toy">
                    <div class="toy-name">
                        COLOUR
                    </div>
                    <div class="toy-status">
                        COMING SOON
                    </div>
                </div>

                <div class="toy">
                    <div class="toy-name">
                        SPIRAL
                    </div>
                    <div class="toy-status">
                        COMING SOON
                    </div>
                </div>

                <div class="toy">
                    <div class="toy-name">
                        RANDOM
                    </div>
                    <div class="toy-status">
                        COMING SOON
                    </div>
                </div>

            </div>

        </div>

    </section>

</div>


<script>

/* =================================
   CORE ELEMENTS
================================= */

const landing =
    document.getElementById("landing");

const playground =
    document.getElementById("playground");

const enterButton =
    document.getElementById("enterButton");

const backButton =
    document.getElementById("backButton");

const pointerLight =
    document.getElementById("pointerLight");

const ambient =
    document.getElementById("ambient");

const liquidCard =
    document.getElementById("liquidCard");

const liquidTitle =
    document.getElementById("liquidTitle");

const energyDot =
    document.getElementById("energyDot");


/* =================================
   GLOBAL POINTER
================================= */

let mouseX =
    window.innerWidth / 2;

let mouseY =
    window.innerHeight / 2;

document.addEventListener(
    "pointermove",
    event => {

        mouseX = event.clientX;
        mouseY = event.clientY;

        pointerLight.style.left =
            mouseX + "px";

        pointerLight.style.top =
            mouseY + "px";

        pointerLight.style.opacity =
            "1";

        ambient.style.transform =
            `translate(
                ${(mouseX - window.innerWidth / 2) * .018}px,
                ${(mouseY - window.innerHeight / 2) * .018}px
            )`;
    }
);

document.addEventListener(
    "pointerleave",
    () => {

        pointerLight.style.opacity =
            "0";
    }
);


/* =================================
   SCREEN TRANSITIONS
================================= */

enterButton.addEventListener(
    "click",
    () => {

        landing.classList.add("exit");

        setTimeout(
            () => {

                playground.classList.add(
                    "active"
                );

                resizeCanvas();

            },
            350
        );
    }
);


backButton.addEventListener(
    "click",
    () => {

        playground.classList.remove(
            "active"
        );

        setTimeout(
            () => {

                landing.classList.remove(
                    "exit"
                );

            },
            300
        );
    }
);


/* =================================
   CANVAS
================================= */

const canvas =
    document.getElementById(
        "liquidCanvas"
    );

const ctx =
    canvas.getContext("2d");

let width = 0;
let height = 0;

let dpr =
    Math.min(
        window.devicePixelRatio || 1,
        2
    );


/* =================================
   POINTER PHYSICS
================================= */

const pointer = {

    x: 0,
    y: 0,

    previousX: 0,
    previousY: 0,

    active: false,

    force: 0,

    speed: 0
};


/* =================================
   BLOB
================================= */

const blob = {

    x: 0,
    y: 0,

    vx: 0,
    vy: 0,

    baseRadius: 100,
    radius: 100,

    rotation: 0,

    hue: 245,

    energy: 0

};


/* =================================
   PARTICLES
================================= */

const particles = [];

const PARTICLE_COUNT = 90;

function createParticles() {

    particles.length = 0;

    for (
        let i = 0;
        i < PARTICLE_COUNT;
        i++
    ) {

        particles.push({

            x:
                Math.random() *
                width,

            y:
                Math.random() *
                height,

            vx: 0,
            vy: 0,

            size:
                Math.random() *
                1.8 + .4,

            alpha:
                Math.random() *
                .25 + .06

        });
    }
}


/* =================================
   RESIZE
================================= */

function resizeCanvas() {

    const rect =
        canvas.getBoundingClientRect();

    width = rect.width;
    height = rect.height;

    canvas.width =
        width * dpr;

    canvas.height =
        height * dpr;

    ctx.setTransform(
        dpr,
        0,
        0,
        dpr,
        0,
        0
    );

    if (!blob.x) {

        blob.x =
            width / 2;

        blob.y =
            height / 2;
    }

    blob.baseRadius =
        Math.min(
            width,
            height
        ) * .19;

    if (!particles.length) {

        createParticles();
    }
}

window.addEventListener(
    "resize",
    resizeCanvas
);


/* =================================
   POINTER POSITION
================================= */

function updatePointer(
    clientX,
    clientY
) {

    const rect =
        canvas.getBoundingClientRect();

    const x =
        clientX - rect.left;

    const y =
        clientY - rect.top;

    pointer.previousX =
        pointer.x;

    pointer.previousY =
        pointer.y;

    pointer.x = x;
    pointer.y = y;

    const dx =
        pointer.x -
        pointer.previousX;

    const dy =
        pointer.y -
        pointer.previousY;

    pointer.speed =
        Math.sqrt(
            dx * dx +
            dy * dy
        );

    pointer.force =
        Math.min(
            pointer.speed / 10,
            1.5
        );

    pointer.active = true;
}


canvas.addEventListener(
    "pointermove",
    event => {

        updatePointer(
            event.clientX,
            event.clientY
        );
    }
);


canvas.addEventListener(
    "pointerdown",
    event => {

        updatePointer(
            event.clientX,
            event.clientY
        );

        createRipple(
            pointer.x,
            pointer.y,
            true
        );
    }
);


canvas.addEventListener(
    "pointerup",
    () => {

        pointer.active = false;
    }
);


canvas.addEventListener(
    "pointercancel",
    () => {

        pointer.active = false;
    }
);


canvas.addEventListener(
    "pointerleave",
    () => {

        pointer.active = false;
    }
);


/* =================================
   RIPPLE SYSTEM
================================= */

const ripples = [];

function createRipple(
    x,
    y,
    strong = false
) {

    ripples.push({

        x,
        y,

        radius:
            strong ? 8 : 3,

        alpha:
            strong ? .7 : .3,

        speed:
            strong ? 5 : 2.5

    });
}


function drawRipples() {

    for (
        let i = ripples.length - 1;
        i >= 0;
        i--
    ) {

        const ripple =
            ripples[i];

        ripple.radius +=
            ripple.speed;

        ripple.alpha *=
            .945;

        ctx.beginPath();

        ctx.arc(
            ripple.x,
            ripple.y,
            ripple.radius,
            0,
            Math.PI * 2
        );

        ctx.strokeStyle =
            `hsla(
                ${blob.hue},
                100%,
                90%,
                ${ripple.alpha}
            )`;

        ctx.lineWidth =
            1.2;

        ctx.stroke();

        if (
            ripple.alpha <
            .008
        ) {

            ripples.splice(
                i,
                1
            );
        }
    }
}


/* =================================
   BLOB PHYSICS
================================= */

function updateBlob() {

    let targetX =
        width / 2;

    let targetY =
        height / 2;


    if (
        pointer.active
    ) {

        targetX =
            pointer.x;

        targetY =
            pointer.y;
    }


    const dx =
        targetX -
        blob.x;

    const dy =
        targetY -
        blob.y;


    blob.vx +=
        dx * .009;

    blob.vy +=
        dy * .009;


    /*
       Liquid resistance
    */

    blob.vx *=
        .875;

    blob.vy *=
        .875;


    blob.x +=
        blob.vx;

    blob.y +=
        blob.vy;


    /*
       Stretch
    */

    const speed =
        Math.sqrt(
            blob.vx *
            blob.vx +
            blob.vy *
            blob.vy
        );


    const targetRadius =
        blob.baseRadius +
        Math.min(
            speed * 2.7,
            38
        );


    blob.radius +=
        (
            targetRadius -
            blob.radius
        ) * .09;


    /*
       Rotation
    */

    blob.rotation +=
        blob.vx * .002;


    /*
       Energy
    */

    blob.energy +=
        (
            Math.min(
                speed * .05,
                1
            ) -
            blob.energy
        ) * .08;


    /*
       Colour shifts
    */

    blob.hue +=
        (
            235 +
            speed * 2 -
            blob.hue
        ) * .015;


    liquidTitle.style.color =
        `hsl(
            ${blob.hue},
            80%,
            92%
        )`;


    /*
       Card reacts to energy
    */

    liquidCard.style.boxShadow =
        `
        inset 0 1px rgba(255,255,255,.08),
        0 30px 100px
        hsla(
            ${blob.hue},
            80%,
            50%,
            ${.05 + blob.energy * .14}
        )
        `;


    /*
       Energy indicator
    */

    if (
        blob.energy >
        .12
    ) {

        energyDot.classList.add(
            "active"
        );

    } else {

        energyDot.classList.remove(
            "active"
        );
    }
}


/* =================================
   PARTICLE PHYSICS
================================= */

function updateParticles() {

    for (
        const particle of particles
    ) {

        /*
           Blob influence
        */

        let dx =
            blob.x -
            particle.x;

        let dy =
            blob.y -
            particle.y;

        let distance =
            Math.sqrt(
                dx * dx +
                dy * dy
            );


        if (
            distance < 250 &&
            distance > 1
        ) {

            const force =
                (
                    250 -
                    distance
                ) / 250;


            /*
               Push particles outward
            */

            particle.vx -=
                (
                    dx / distance
                ) *
                force *
                .16;

            particle.vy -=
                (
                    dy / distance
                ) *
                force *
                .16;
        }


        /*
           Pointer influence
        */

        if (
            pointer.active
        ) {

            dx =
                pointer.x -
                particle.x;

            dy =
                pointer.y -
                particle.y;

            distance =
                Math.sqrt(
                    dx * dx +
                    dy * dy
                );


            if (
                distance < 150 &&
                distance > 1
            ) {

                const force =
                    (
                        150 -
                        distance
                    ) / 150;


                particle.vx -=
                    (
                        dx / distance
                    ) *
                    force *
                    pointer.force *
                    .35;

                particle.vy -=
                    (
                        dy / distance
                    ) *
                    force *
                    pointer.force *
                    .35;
            }
        }


        /*
           Friction
        */

        particle.vx *=
            .975;

        particle.vy *=
            .975;


        particle.x +=
            particle.vx;

        particle.y +=
            particle.vy;


        /*
           Wrap around
        */

        if (
            particle.x < -10
        ) {

            particle.x =
                width + 10;
        }

        if (
            particle.x >
            width + 10
        ) {

            particle.x =
                -10;
        }

        if (
            particle.y < -10
        ) {

            particle.y =
                height + 10;
        }

        if (
            particle.y >
            height + 10
        ) {

            particle.y =
                -10;
        }
    }
}


/* =================================
   DRAW PARTICLES
================================= */

function drawParticles() {

    for (
        const particle of particles
    ) {

        ctx.beginPath();

        ctx.arc(
            particle.x,
            particle.y,
            particle.size,
            0,
            Math.PI * 2
        );


        ctx.fillStyle =
            `hsla(
                ${blob.hue},
                70%,
                90%,
                ${particle.alpha}
            )`;


        ctx.fill();
    }
}


/* =================================
   DRAW LIQUID BLOB
================================= */

function drawBlob() {

    const points = 72;

    const coords = [];

    const time =
        performance.now();


    for (
        let i = 0;
        i < points;
        i++
    ) {

        const angle =
            (
                Math.PI *
                2 *
                i
            ) / points;


        /*
           Organic surface
        */

        const wave1 =
            Math.sin(
                angle * 3 +
                time * .0015
            ) * 5;


        const wave2 =
            Math.sin(
                angle * 5 -
                time * .0011
            ) * 3;


        const wave3 =
            Math.sin(
                angle * 7 +
                time * .0008
            ) * 2;


        /*
           Movement stretch
        */

        let velocityStretch = 0;

        const velocity =
            Math.sqrt(
                blob.vx *
                blob.vx +
                blob.vy *
                blob.vy
            );


        if (
            velocity > .1
        ) {

            velocityStretch =
                Math.cos(
                    angle -
                    Math.atan2(
                        blob.vy,
                        blob.vx
                    )
                ) *
                Math.min(
                    velocity * 2,
                    30
                );
        }


        const radius =
            blob.radius +
            wave1 +
            wave2 +
            wave3 +
            velocityStretch;


        coords.push({

            x:
                blob.x +
                Math.cos(
                    angle +
                    blob.rotation
                ) *
                radius,

            y:
                blob.y +
                Math.sin(
                    angle +
                    blob.rotation
                ) *
                radius

        });
    }


    /*
       Gradient
    */

    const gradient =
        ctx.createRadialGradient(

            blob.x -
            blob.radius * .35,

            blob.y -
            blob.radius * .4,

            5,

            blob.x,

            blob.y,

            blob.radius * 1.4
        );


    gradient.addColorStop(
        0,
        `hsla(
            ${blob.hue},
            100%,
            98%,
            .98
        )`
    );


    gradient.addColorStop(
        .22,
        `hsla(
            ${blob.hue},
            90%,
            85%,
            .9
        )`
    );


    gradient.addColorStop(
        .55,
        `hsla(
            ${blob.hue},
            80%,
            60%,
            .7
        )`
    );


    gradient.addColorStop(
        1,
        `hsla(
            ${blob.hue},
            80%,
            30%,
            .12
        )`
    );


    /*
       Shape
    */

    ctx.beginPath();

    const first =
        coords[0];

    ctx.moveTo(
        first.x,
        first.y
    );


    for (
        let i = 0;
        i < coords.length;
        i++
    ) {

        const current =
            coords[i];

        const next =
            coords[
                (i + 1) %
                coords.length
            ];


        const midpointX =
            (
                current.x +
                next.x
            ) / 2;


        const midpointY =
            (
                current.y +
                next.y
            ) / 2;


        ctx.quadraticCurveTo(

            current.x,
            current.y,

            midpointX,
            midpointY
        );
    }


    ctx.closePath();


    /*
       Outer glow
    */

    ctx.shadowBlur =
        65;

    ctx.shadowColor =
        `hsla(
            ${blob.hue},
            90%,
            60%,
            .45
        )`;


    ctx.fillStyle =
        gradient;

    ctx.fill();


    ctx.shadowBlur = 0;


    /*
       Glass highlight
    */

    const highlight =
        ctx.createRadialGradient(

            blob.x -
            blob.radius * .35,

            blob.y -
            blob.radius * .4,

            0,

            blob.x -
            blob.radius * .35,

            blob.y -
            blob.radius * .4,

            blob.radius * .35
        );


    highlight.addColorStop(
        0,
        "rgba(255,255,255,.3)"
    );


    highlight.addColorStop(
        1,
        "rgba(255,255,255,0)"
    );


    ctx.beginPath();

    ctx.arc(

        blob.x -
        blob.radius * .3,

        blob.y -
        blob.radius * .35,

        blob.radius * .3,

        0,

        Math.PI * 2

    );


    ctx.fillStyle =
        highlight;

    ctx.fill();
}


/* =================================
   AUTO RIPPLE
================================= */

let rippleTimer = 0;

function ambientRipple() {

    rippleTimer++;

    if (
        rippleTimer > 100
    ) {

        rippleTimer = 0;

        if (
            !pointer.active
        ) {

            createRipple(
                blob.x,
                blob.y
            );
        }
    }
}


/* =================================
   MAIN LOOP
================================= */

function animate() {

    ctx.clearRect(
        0,
        0,
        width,
        height
    );


    updateBlob();

    updateParticles();

    ambientRipple();

    drawParticles();

    drawRipples();

    drawBlob();


    requestAnimationFrame(
        animate
    );
}


/* =================================
   START
================================= */

resizeCanvas();

animate();

</script>
