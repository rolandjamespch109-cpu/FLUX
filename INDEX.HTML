<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#050505">
<title>FLUX</title>

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

html,
body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #050505;
    color: white;
    font-family: Arial, Helvetica, sans-serif;
}

body {
    cursor: default;
}

button {
    font: inherit;
}

#app {
    position: relative;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background:
        radial-gradient(circle at 50% 45%, rgba(90, 70, 255, 0.08), transparent 35%),
        #050505;
}

/* =========================
   AMBIENT BACKGROUND
========================= */

.ambient {
    position: absolute;
    inset: -25%;
    pointer-events: none;
    filter: blur(80px);
    opacity: .7;
    transition: transform 1s cubic-bezier(.2,.8,.2,1);
}

.orb {
    position: absolute;
    border-radius: 50%;
    mix-blend-mode: screen;
    animation: float 10s ease-in-out infinite alternate;
}

.orb.one {
    width: 42vw;
    height: 42vw;
    min-width: 280px;
    min-height: 280px;
    background: rgba(82, 56, 255, .18);
    top: 5%;
    left: 8%;
}

.orb.two {
    width: 35vw;
    height: 35vw;
    min-width: 240px;
    min-height: 240px;
    background: rgba(0, 190, 255, .12);
    right: 5%;
    bottom: 5%;
    animation-delay: -3s;
}

.orb.three {
    width: 28vw;
    height: 28vw;
    min-width: 200px;
    min-height: 200px;
    background: rgba(255, 50, 170, .09);
    left: 40%;
    top: 55%;
    animation-delay: -6s;
}

@keyframes float {
    from {
        transform: translate3d(-20px, -15px, 0) scale(1);
    }

    to {
        transform: translate3d(25px, 25px, 0) scale(1.12);
    }
}

/* =========================
   POINTER LIGHT
========================= */

.pointer-light {
    position: fixed;
    width: 320px;
    height: 320px;
    border-radius: 50%;
    pointer-events: none;
    transform: translate(-50%, -50%);
    background: radial-gradient(
        circle,
        rgba(255,255,255,.07),
        rgba(100,80,255,.035) 35%,
        transparent 70%
    );
    z-index: 2;
    opacity: 0;
    transition: opacity .4s ease;
}

/* =========================
   LANDING
========================= */

.screen {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    transition:
        opacity .9s cubic-bezier(.2,.8,.2,1),
        transform 1s cubic-bezier(.2,.8,.2,1),
        filter 1s ease;
}

#landing {
    z-index: 10;
}

#landing.exit {
    opacity: 0;
    transform: scale(1.12);
    filter: blur(18px);
    pointer-events: none;
}

.hero {
    position: relative;
    width: min(900px, 92vw);
    text-align: center;
    z-index: 5;
}

.mini-label {
    font-size: 11px;
    letter-spacing: .38em;
    text-transform: uppercase;
    opacity: .45;
    margin-bottom: 28px;
}

.logo {
    font-size: clamp(72px, 17vw, 190px);
    line-height: .78;
    letter-spacing: -.085em;
    font-weight: 800;
    background: linear-gradient(
        120deg,
        #ffffff 10%,
        #bdb7ff 45%,
        #ffffff 70%,
        #8de8ff
    );
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    animation: logoPulse 5s ease-in-out infinite;
    user-select: none;
}

@keyframes logoPulse {
    0%, 100% {
        transform: scale(1);
        filter: brightness(1);
    }

    50% {
        transform: scale(1.015);
        filter: brightness(1.12);
    }
}

.tagline {
    margin-top: 35px;
    font-size: clamp(16px, 2.2vw, 24px);
    letter-spacing: .02em;
    opacity: .65;
}

.enter {
    position: relative;
    margin-top: 48px;
    border: 1px solid rgba(255,255,255,.18);
    background: rgba(255,255,255,.055);
    color: white;
    padding: 18px 34px;
    min-width: 190px;
    border-radius: 999px;
    cursor: pointer;
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    box-shadow:
        inset 0 1px rgba(255,255,255,.12),
        0 20px 70px rgba(0,0,0,.3);
    transition:
        transform .35s cubic-bezier(.2,.8,.2,1),
        background .35s ease,
        border-color .35s ease,
        box-shadow .35s ease;
    overflow: hidden;
}

.enter span {
    position: relative;
    z-index: 2;
    font-size: 12px;
    font-weight: 700;
    letter-spacing: .2em;
}

.enter::before {
    content: "";
    position: absolute;
    inset: 0;
    background: linear-gradient(
        110deg,
        transparent,
        rgba(255,255,255,.15),
        transparent
    );
    transform: translateX(-120%);
    transition: transform .7s ease;
}

.enter:hover {
    transform: translateY(-5px) scale(1.03);
    background: rgba(255,255,255,.1);
    border-color: rgba(255,255,255,.32);
    box-shadow:
        0 20px 70px rgba(90,80,255,.15),
        inset 0 1px rgba(255,255,255,.18);
}

.enter:hover::before {
    transform: translateX(120%);
}

.enter:active {
    transform: scale(.94);
}

/* =========================
   PLAYGROUND
========================= */

#playground {
    opacity: 0;
    transform: scale(.94);
    pointer-events: none;
    z-index: 5;
    flex-direction: column;
    justify-content: flex-start;
    padding: 28px;
}

#playground.active {
    opacity: 1;
    transform: scale(1);
    pointer-events: auto;
}

.play-top {
    width: min(1100px, 100%);
    display: flex;
    align-items: center;
    justify-content: space-between;
    z-index: 5;
}

.flux-small {
    font-size: 15px;
    font-weight: 800;
    letter-spacing: .15em;
}

.back {
    border: 1px solid rgba(255,255,255,.13);
    background: rgba(255,255,255,.045);
    color: rgba(255,255,255,.7);
    padding: 10px 17px;
    border-radius: 999px;
    cursor: pointer;
    backdrop-filter: blur(15px);
    -webkit-backdrop-filter: blur(15px);
    transition: .3s ease;
}

.back:hover {
    color: white;
    background: rgba(255,255,255,.09);
}

.play-content {
    width: min(1100px, 100%);
    flex: 1;
    display: flex;
    flex-direction: column;
    justify-content: center;
    padding: 30px 0;
}

.play-title {
    margin-bottom: 20px;
}

.play-title small {
    display: block;
    font-size: 10px;
    letter-spacing: .35em;
    opacity: .35;
    margin-bottom: 10px;
}

.play-title h2 {
    font-size: clamp(30px, 6vw, 62px);
    letter-spacing: -.045em;
    font-weight: 700;
}

.play-title p {
    margin-top: 10px;
    opacity: .45;
    font-size: 14px;
}

/* =========================
   LIQUID CARD
========================= */

.liquid-card {
    position: relative;
    height: min(55vh, 520px);
    min-height: 320px;
    border: 1px solid rgba(255,255,255,.1);
    border-radius: 32px;
    overflow: hidden;
    background: rgba(255,255,255,.025);
    box-shadow:
        inset 0 1px rgba(255,255,255,.06),
        0 30px 100px rgba(0,0,0,.35);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
}

#liquidCanvas {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    touch-action: none;
}

.liquid-info {
    position: absolute;
    left: 24px;
    bottom: 22px;
    pointer-events: none;
    z-index: 2;
}

.liquid-info strong {
    display: block;
    font-size: 12px;
    letter-spacing: .18em;
}

.liquid-info span {
    display: block;
    margin-top: 6px;
    font-size: 11px;
    opacity: .35;
}

/* =========================
   FUTURE TOYS
========================= */

.toys {
    display: flex;
    gap: 10px;
    margin-top: 12px;
    overflow-x: auto;
    scrollbar-width: none;
}

.toys::-webkit-scrollbar {
    display: none;
}

.toy {
    flex: 1;
    min-width: 130px;
    border: 1px solid rgba(255,255,255,.07);
    background: rgba(255,255,255,.025);
    border-radius: 18px;
    padding: 15px;
    opacity: .38;
}

.toy-name {
    font-size: 11px;
    letter-spacing: .1em;
}

.toy-status {
    margin-top: 7px;
    font-size: 9px;
    letter-spacing: .15em;
    text-transform: uppercase;
}

/* =========================
   MOBILE
========================= */

@media (max-width: 600px) {
    #playground {
        padding: 20px;
    }

    .mini-label {
        margin-bottom: 22px;
    }

    .tagline {
        margin-top: 25px;
    }

    .enter {
        margin-top: 35px;
    }

    .play-content {
        padding: 20px 0;
    }

    .liquid-card {
        height: 48vh;
        min-height: 300px;
        border-radius: 25px;
    }

    .toy {
        flex: 0 0 135px;
    }
}
</style>
</head>

<body>

<div id="app">

    <div class="ambient" id="ambient">
        <div class="orb one"></div>
        <div class="orb two"></div>
        <div class="orb three"></div>
    </div>

    <div class="pointer-light" id="pointerLight"></div>

    <!-- LANDING -->
    <section class="screen" id="landing">

        <div class="hero">

            <div class="mini-label">
                A digital playground
            </div>

            <div class="logo">
                FLUX
            </div>

            <div class="tagline">
                Do you wanna play with Flux?
            </div>

            <button class="enter" id="enterButton">
                <span>LET'S PLAY</span>
            </button>

        </div>

    </section>


    <!-- PLAYGROUND -->
    <section class="screen" id="playground">

        <div class="play-top">
            <div class="flux-small">FLUX</div>

            <button class="back" id="backButton">
                ← EXIT
            </button>
        </div>

        <div class="play-content">

            <div class="play-title">
                <small>PLAYGROUND / 001</small>
                <h2>Liquid.</h2>
                <p>Move your finger. Disturb the surface.</p>
            </div>

            <div class="liquid-card">
                <canvas id="liquidCanvas"></canvas>

                <div class="liquid-info">
                    <strong>LIQUID BLOB</strong>
                    <span>MOVE • TOUCH • EXPLORE</span>
                </div>
            </div>

            <div class="toys">

                <div class="toy">
                    <div class="toy-name">GRAVITY</div>
                    <div class="toy-status">COMING SOON</div>
                </div>

                <div class="toy">
                    <div class="toy-name">COLOUR</div>
                    <div class="toy-status">COMING SOON</div>
                </div>

                <div class="toy">
                    <div class="toy-name">SPIRAL</div>
                    <div class="toy-status">COMING SOON</div>
                </div>

                <div class="toy">
                    <div class="toy-name">RANDOM</div>
                    <div class="toy-status">COMING SOON</div>
                </div>

            </div>

        </div>

    </section>

</div>


<script>
/* =========================
   FLUX CORE
========================= */

const landing = document.getElementById("landing");
const playground = document.getElementById("playground");
const enterButton = document.getElementById("enterButton");
const backButton = document.getElementById("backButton");
const pointerLight = document.getElementById("pointerLight");
const ambient = document.getElementById("ambient");

let mouseX = window.innerWidth / 2;
let mouseY = window.innerHeight / 2;

document.addEventListener("pointermove", (event) => {

    mouseX = event.clientX;
    mouseY = event.clientY;

    pointerLight.style.left = mouseX + "px";
    pointerLight.style.top = mouseY + "px";
    pointerLight.style.opacity = "1";

    ambient.style.transform =
        `translate(${(mouseX - window.innerWidth / 2) * .018}px,
                   ${(mouseY - window.innerHeight / 2) * .018}px)`;
});

document.addEventListener("pointerleave", () => {
    pointerLight.style.opacity = "0";
});


/* =========================
   SCREEN TRANSITION
========================= */

enterButton.addEventListener("click", () => {

    landing.classList.add("exit");

    setTimeout(() => {
        playground.classList.add("active");
        resizeCanvas();
    }, 350);
});


backButton.addEventListener("click", () => {

    playground.classList.remove("active");

    setTimeout(() => {
        landing.classList.remove("exit");
    }, 300);
});


/* =========================
   LIQUID BLOB
========================= */

const canvas = document.getElementById("liquidCanvas");
const ctx = canvas.getContext("2d");

let width = 0;
let height = 0;
let dpr = Math.min(window.devicePixelRatio || 1, 2);

let pointer = {
    x: 0,
    y: 0,
    active: false,
    force: 0
};

const blob = {
    x: 0,
    y: 0,
    baseRadius: 105,
    radius: 105,
    vx: 0,
    vy: 0,
    rotation: 0
};

const particles = [];

function resizeCanvas() {

    const rect = canvas.getBoundingClientRect();

    width = rect.width;
    height = rect.height;

    canvas.width = width * dpr;
    canvas.height = height * dpr;

    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

    blob.x = width / 2;
    blob.y = height / 2;

    blob.baseRadius = Math.min(width, height) * .19;

    if (!particles.length) {
        createParticles();
    }
}

function createParticles() {

    particles.length = 0;

    for (let i = 0; i < 65; i++) {

        particles.push({
            x: Math.random() * width,
            y: Math.random() * height,
            vx: 0,
            vy: 0,
            size: Math.random() * 1.8 + .5,
            alpha: Math.random() * .25 + .08
        });
    }
}

window.addEventListener("resize", resizeCanvas);


/* =========================
   TOUCH / MOUSE
========================= */

function updatePointer(clientX, clientY) {

    const rect = canvas.getBoundingClientRect();

    pointer.x = clientX - rect.left;
    pointer.y = clientY - rect.top;
    pointer.active = true;
    pointer.force = 1;
}

canvas.addEventListener("pointermove", (event) => {
    updatePointer(event.clientX, event.clientY);
});

canvas.addEventListener("pointerdown", (event) => {
    updatePointer(event.clientX, event.clientY);
});

canvas.addEventListener("pointerup", () => {
    pointer.active = false;
});

canvas.addEventListener("pointercancel", () => {
    pointer.active = false;
});

canvas.addEventListener("pointerleave", () => {
    pointer.active = false;
});


/* =========================
   BLOB PHYSICS
========================= */

function updateBlob() {

    let targetX = width / 2;
    let targetY = height / 2;

    if (pointer.active) {
        targetX = pointer.x;
        targetY = pointer.y;
    }

    const dx = targetX - blob.x;
    const dy = targetY - blob.y;

    blob.vx += dx * .008;
    blob.vy += dy * .008;

    blob.vx *= .87;
    blob.vy *= .87;

    blob.x += blob.vx;
    blob.y += blob.vy;

    const speed = Math.sqrt(
        blob.vx * blob.vx +
        blob.vy * blob.vy
    );

    const targetRadius =
        blob.baseRadius +
        Math.min(speed * 2.2, 35);

    blob.radius +=
        (targetRadius - blob.radius) * .09;

    blob.rotation +=
        blob.vx * .002;

    pointer.force *= .93;
}


/* =========================
   DRAW BACKGROUND PARTICLES
========================= */

function updateParticles() {

    for (const p of particles) {

        const dx = blob.x - p.x;
        const dy = blob.y - p.y;

        const distance = Math.sqrt(dx * dx + dy * dy);

        if (distance < 220) {

            const force =
                (220 - distance) / 220;

            p.vx -= (dx / distance) * force * .12;
            p.vy -= (dy / distance) * force * .12;
        }

        p.vx *= .98;
        p.vy *= .98;

        p.x += p.vx;
        p.y += p.vy;

        if (p.x < -10) p.x = width + 10;
        if (p.x > width + 10) p.x = -10;
        if (p.y < -10) p.y = height + 10;
        if (p.y > height + 10) p.y = -10;
    }
}

function drawParticles() {

    for (const p of particles) {

        ctx.beginPath();
        ctx.arc(
            p.x,
            p.y,
            p.size,
            0,
            Math.PI * 2
        );

        ctx.fillStyle =
            `rgba(255,255,255,${p.alpha})`;

        ctx.fill();
    }
}


/* =========================
   DRAW LIQUID
========================= */

function drawBlob() {

    const points = 64;
    const coords = [];

    for (let i = 0; i < points; i++) {

        const angle =
            (Math.PI * 2 * i) / points;

        const wave1 =
            Math.sin(angle * 3 + performance.now() * .0015) * 5;

        const wave2 =
            Math.sin(angle * 5 - performance.now() * .0011) * 3;

        const velocityStretch =
            Math.cos(angle - Math.atan2(blob.vy, blob.vx))
            * Math.min(
                Math.sqrt(blob.vx * blob.vx + blob.vy * blob.vy) * 1.8,
                28
            );

        const r =
            blob.radius +
            wave1 +
            wave2 +
            velocityStretch;

        coords.push({
            x: blob.x + Math.cos(angle + blob.rotation) * r,
            y: blob.y + Math.sin(angle + blob.rotation) * r
        });
    }

    const gradient = ctx.createRadialGradient(
        blob.x - blob.radius * .35,
        blob.y - blob.radius * .4,
        5,
        blob.x,
        blob.y,
        blob.radius * 1.35
    );

    gradient.addColorStop(0, "rgba(255,255,255,.95)");
    gradient.addColorStop(.22, "rgba(170,165,255,.88)");
    gradient.addColorStop(.58, "rgba(92,80,255,.65)");
    gradient.addColorStop(1, "rgba(30,20,100,.18)");

    ctx.beginPath();

    const first = coords[0];

    ctx.moveTo(
        first.x,
        first.y
    );

    for (let i = 0; i < coords.length; i++) {

        const current = coords[i];
        const next = coords[(i + 1) % coords.length];

        const midX =
            (current.x + next.x) / 2;

        const midY =
            (current.y + next.y) / 2;

        ctx.quadraticCurveTo(
            current.x,
            current.y,
            midX,
            midY
        );
    }

    ctx.closePath();

    ctx.shadowBlur = 55;
    ctx.shadowColor =
        "rgba(90,80,255,.5)";

    ctx.fillStyle = gradient;
    ctx.fill();

    ctx.shadowBlur = 0;

    /* Inner glow */

    ctx.beginPath();

    ctx.arc(
        blob.x - blob.radius * .3,
        blob.y - blob.radius * .35,
        blob.radius * .25,
        0,
        Math.PI * 2
    );

    const highlight =
        ctx.createRadialGradient(
            blob.x - blob.radius * .3,
            blob.y - blob.radius * .35,
            0,
            blob.x - blob.radius * .3,
            blob.y - blob.radius * .35,
            blob.radius * .25
        );

    highlight.addColorStop(
        0,
        "rgba(255,255,255,.28)"
    );

    highlight.addColorStop(
        1,
        "rgba(255,255,255,0)"
    );

    ctx.fillStyle = highlight;
    ctx.fill();
}


/* =========================
   POINTER RIPPLE
========================= */

let ripples = [];

canvas.addEventListener("pointerdown", (event) => {

    const rect = canvas.getBoundingClientRect();

    ripples.push({
        x: event.clientX - rect.left,
        y: event.clientY - rect.top,
        radius: 5,
        alpha: .55
    });
});

function drawRipples() {

    for (let i = ripples.length - 1; i >= 0; i--) {

        const r = ripples[i];

        r.radius += 3.5;
        r.alpha *= .94;

        ctx.beginPath();

        ctx.arc(
            r.x,
            r.y,
            r.radius,
            0,
            Math.PI * 2
        );

        ctx.strokeStyle =
            `rgba(255,255,255,${r.alpha})`;

        ctx.lineWidth = 1;

        ctx.stroke();

        if (r.alpha < .01) {
            ripples.splice(i, 1);
        }
    }
}


/* =========================
   MAIN LOOP
========================= */

function animate() {

    ctx.clearRect(
        0,
        0,
        width,
        height
    );

    updateBlob();
    updateParticles();

    drawParticles();
    drawRipples();
    drawBlob();

    requestAnimationFrame(animate);
}

resizeCanvas();
animate();

</script>

</body>
</html>
